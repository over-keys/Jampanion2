<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6e69" />
    <meta name="description" content="Jampanion adaptive jazz backing partner" />
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest?v=33" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/jampanion-32.png?v=33" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/jampanion-48.png?v=33" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/jampanion-180.png?v=33" />
    <link rel="stylesheet" href="css/app.css?v=33" />
    <title>Jampanion2</title>
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <img src="icons/jampanion-192.png?v=33" alt="" width="72" height="72" />
            <strong>Jampanion2</strong>
            <span>Loading the web app…</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unexpected error occurred. Please clear your browser's cached files for this site, then reload the page.
        <a href="." class="reload">Reload</a>
        <button class="dismiss" type="button">×</button>
    </div>

    <script>
        (() => {
            const APP_VERSION = "33";
            const CACHE_VERSION_KEY = "jampanion-web-cache-version";
            const RESET_RELOAD_KEY = "jampanion-web-cache-reset-reload";
            const BOOT_RECOVERY_KEY = "jampanion-web-boot-recovery";
            const RECOVERY_QUERY_KEY = "_jampanion_recover";
            const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
            let forceFreshBoot = isLocal;

            async function removeJampanionCaches() {
                if (!("caches" in window)) return;
                const keys = await caches.keys();
                await Promise.all(keys
                    .filter(key => key.startsWith("jampanion-web-"))
                    .map(key => caches.delete(key)));
            }

            async function unregisterJampanionWorkers() {
                if (!("serviceWorker" in navigator)) return false;
                const wasControlled = navigator.serviceWorker.controller !== null;
                const baseUrl = new URL(".", document.baseURI).href;
                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations
                    .filter(registration => registration.scope.startsWith(baseUrl))
                    .map(registration => registration.unregister()));
                return wasControlled;
            }

            function hasRecoveryQuery() {
                return new URL(location.href).searchParams.has(RECOVERY_QUERY_KEY);
            }

            function recoveryUrl() {
                const url = new URL(location.href);
                url.searchParams.set(RECOVERY_QUERY_KEY, `${APP_VERSION}-${Date.now()}`);
                return url.href;
            }

            function clearRecoveryQuery() {
                const url = new URL(location.href);
                if (!url.searchParams.has(RECOVERY_QUERY_KEY)) return;
                url.searchParams.delete(RECOVERY_QUERY_KEY);
                history.replaceState(history.state, "", url.href);
            }

            function showFatalError() {
                const errorUi = document.getElementById("blazor-error-ui");
                if (errorUi) errorUi.style.display = "block";
            }

            async function prepareCleanBoot() {
                let installedVersion = null;
                try {
                    installedVersion = localStorage.getItem(CACHE_VERSION_KEY);
                } catch {
                    // Storage can be unavailable in restricted browsing modes.
                }

                const versionChanged = installedVersion !== APP_VERSION;
                const recoveryRequested = hasRecoveryQuery();
                forceFreshBoot = isLocal || versionChanged || recoveryRequested;
                if (!forceFreshBoot) return true;

                const wasControlled = await unregisterJampanionWorkers();
                await removeJampanionCaches();

                try {
                    localStorage.setItem(CACHE_VERSION_KEY, APP_VERSION);
                } catch {
                    // A clean network boot remains possible without localStorage.
                }

                if (!isLocal && wasControlled) {
                    try {
                        if (sessionStorage.getItem(RESET_RELOAD_KEY) !== APP_VERSION) {
                            sessionStorage.setItem(RESET_RELOAD_KEY, APP_VERSION);
                            location.replace(recoveryUrl());
                            return false;
                        }
                    } catch {
                        location.replace(recoveryUrl());
                        return false;
                    }
                }

                return true;
            }

            async function recoverBoot(error) {
                console.warn("Jampanion startup failed; retrying with a fresh network boot.", error);
                try {
                    await unregisterJampanionWorkers();
                    await removeJampanionCaches();
                } catch (cleanupError) {
                    console.warn("Could not completely clear stale Jampanion caches.", cleanupError);
                }

                try {
                    if (sessionStorage.getItem(BOOT_RECOVERY_KEY) !== APP_VERSION) {
                        sessionStorage.setItem(BOOT_RECOVERY_KEY, APP_VERSION);
                        location.replace(recoveryUrl());
                        return;
                    }
                } catch {
                    if (!hasRecoveryQuery()) {
                        location.replace(recoveryUrl());
                        return;
                    }
                }

                showFatalError();
            }

            async function startBlazor() {
                try {
                    if (!await prepareCleanBoot()) return;
                    try {
                        sessionStorage.removeItem(RESET_RELOAD_KEY);
                    } catch {
                        // Ignore unavailable session storage.
                    }
                } catch (error) {
                    console.warn("Could not reset stale Jampanion caches.", error);
                    forceFreshBoot = true;
                }

                const script = document.createElement("script");
                script.src = "_framework/blazor.webassembly.js?v=33";
                script.async = false;
                script.setAttribute("autostart", "false");

                script.addEventListener("error", () => {
                    void recoverBoot(new Error("Blazor loader could not be loaded."));
                }, { once: true });

                script.addEventListener("load", () => {
                    void (async () => {
                        try {
                            if (!window.Blazor || typeof window.Blazor.start !== "function") {
                                throw new Error("Blazor startup API is unavailable.");
                            }

                            await window.Blazor.start({
                                loadBootResource(type, name, defaultUri, integrity) {
                                    if (!forceFreshBoot || type === "dotnetjs") return null;
                                    return fetch(defaultUri, {
                                        cache: "reload",
                                        integrity
                                    });
                                }
                            });

                            try {
                                sessionStorage.removeItem(BOOT_RECOVERY_KEY);
                            } catch {
                                // Ignore unavailable session storage.
                            }
                            clearRecoveryQuery();
                        } catch (error) {
                            await recoverBoot(error);
                        }
                    })();
                }, { once: true });

                document.body.appendChild(script);
            }

            void startBlazor();

            // Offline caching is intentionally disabled while the Web version is
            // evolving rapidly. This prevents an older worker from combining old
            // framework files with a newly deployed application.
        })();
    </script>
</body>
</html>
