<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6e69" />
    <meta name="description" content="Jampanion adaptive jazz backing partner" />
    <base href="/" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/jampanion-32.png?v=47" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/jampanion-48.png?v=47" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/jampanion-180.png?v=47" />
    <link rel="stylesheet" href="css/app.css?v=47" />
    <title>Jampanion2</title>
</head>
<body>
    <div id="app">
        <div class="boot-screen">
        <img src="icons/jampanion-192.png?v=47" alt="" width="72" height="72" />
            <strong>Jampanion2</strong>
            <span>Loading the web app…</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        The app could not start after automatic cache recovery. Press Reload to try again.
        <a href="." class="reload">Reload</a>
        <button class="dismiss" type="button">×</button>
    </div>

    <script>
        (() => {
            const APP_VERSION = "47";
            const CACHE_VERSION_KEY = "jampanion-web-cache-version";
            const BOOT_RECOVERY_KEY = "jampanion-web-boot-recovery";
            const SHELL_REFRESH_KEY = "jampanion-web-shell-refresh";
            const SHELL_REFRESH_QUERY = "_jampanion_shell";
            const RECOVERY_QUERY_KEY = "_jampanion_recover";
            const PUBLISHED_VERSION_URL = "app-version.json";
            const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
            let forceFreshBoot = isLocal;

            async function removeJampanionCaches() {
                if (!("caches" in window)) return;
                const keys = await caches.keys();
                await Promise.all(keys
                    .filter(key => key.startsWith("jampanion-web-"))
                    .map(key => caches.delete(key)));
            }

            async function readPublishedVersion() {
                if (isLocal) return null;
                try {
                    const url = new URL(PUBLISHED_VERSION_URL, document.baseURI);
                    url.searchParams.set("probe", String(Date.now()));
                    const response = await fetch(url.href, {
                        cache: "no-store",
                        credentials: "same-origin"
                    });
                    if (!response.ok) return null;
                    const payload = await response.json();
                    return typeof payload.version === "string" ? payload.version : null;
                } catch {
                    return null;
                }
            }

            function hasRecoveryQuery() {
                return new URL(location.href).searchParams.has(RECOVERY_QUERY_KEY);
            }

            function recoveryUrl() {
                const url = new URL(location.href);
                url.searchParams.set(RECOVERY_QUERY_KEY, `${APP_VERSION}-${Date.now()}`);
                return url.href;
            }

            function shellRefreshUrl(publishedVersion) {
                const url = new URL(location.href);
                url.searchParams.set(SHELL_REFRESH_QUERY, publishedVersion);
                url.searchParams.set(RECOVERY_QUERY_KEY, `${publishedVersion}-${Date.now()}`);
                return url.href;
            }

            function clearBootQueries() {
                const url = new URL(location.href);
                if (!url.searchParams.has(RECOVERY_QUERY_KEY) && !url.searchParams.has(SHELL_REFRESH_QUERY)) return;
                url.searchParams.delete(RECOVERY_QUERY_KEY);
                url.searchParams.delete(SHELL_REFRESH_QUERY);
                history.replaceState(history.state, "", url.href);
            }

            function showFatalError() {
                const errorUi = document.getElementById("blazor-error-ui");
                if (errorUi) errorUi.style.display = "block";
            }

            async function prepareCleanBoot() {
                let installedVersion = null;
                try {
                    installedVersion = localStorage.getItem(CACHE_VERSION_KEY);
                } catch {
                    // Storage can be unavailable in restricted browsing modes.
                }

                const publishedVersion = await readPublishedVersion();
                if (publishedVersion && publishedVersion !== APP_VERSION) {
                    try {
                        if (sessionStorage.getItem(SHELL_REFRESH_KEY) !== publishedVersion) {
                            sessionStorage.setItem(SHELL_REFRESH_KEY, publishedVersion);
                            location.replace(shellRefreshUrl(publishedVersion));
                            return false;
                        }
                    } catch {
                        location.replace(shellRefreshUrl(publishedVersion));
                        return false;
                    }
                }

                const versionChanged = installedVersion !== APP_VERSION;
                const recoveryRequested = hasRecoveryQuery();
                forceFreshBoot = isLocal || versionChanged || recoveryRequested;
                if (!forceFreshBoot) return true;

                await removeJampanionCaches();

                return true;
            }

            async function recoverBoot(error) {
                console.warn("Jampanion startup failed; retrying with a fresh network boot.", error);
                try {
                    await removeJampanionCaches();
                } catch (cleanupError) {
                    console.warn("Could not completely clear stale Jampanion caches.", cleanupError);
                }

                try {
                    if (sessionStorage.getItem(BOOT_RECOVERY_KEY) !== APP_VERSION) {
                        sessionStorage.setItem(BOOT_RECOVERY_KEY, APP_VERSION);
                        location.replace(recoveryUrl());
                        return;
                    }
                } catch {
                    if (!hasRecoveryQuery()) {
                        location.replace(recoveryUrl());
                        return;
                    }
                }

                showFatalError();
            }

            async function startBlazor() {
                try {
                    if (!await prepareCleanBoot()) return;
                } catch (error) {
                    console.warn("Could not reset stale Jampanion caches.", error);
                    forceFreshBoot = true;
                }

                const script = document.createElement("script");
                script.src = "_framework/blazor.webassembly.js?v=47";
                script.async = false;
                script.setAttribute("autostart", "false");

                script.addEventListener("error", () => {
                    void recoverBoot(new Error("Blazor loader could not be loaded."));
                }, { once: true });

                script.addEventListener("load", () => {
                    void (async () => {
                        try {
                            if (!window.Blazor || typeof window.Blazor.start !== "function") {
                                throw new Error("Blazor startup API is unavailable.");
                            }

                            await window.Blazor.start({
                                loadBootResource(type, name, defaultUri, integrity) {
                                    if (!forceFreshBoot || type === "dotnetjs") return null;
                                    return fetch(defaultUri, {
                                        cache: "reload",
                                        integrity
                                    });
                                }
                            });

                            try {
                                localStorage.setItem(CACHE_VERSION_KEY, APP_VERSION);
                            } catch {
                                // A clean network boot remains possible without localStorage.
                            }
                            try {
                                sessionStorage.removeItem(BOOT_RECOVERY_KEY);
                            } catch {
                                // Ignore unavailable session storage.
                            }
                            clearBootQueries();
                        } catch (error) {
                            await recoverBoot(error);
                        }
                    })();
                }, { once: true });

                document.body.appendChild(script);
            }

            void startBlazor();

            // The online Web shell deliberately has no service-worker cache. The
            // Viewer can still be used from local-viewer/index.html when an
            // entirely local chart reader is needed.
        })();
    </script>
</body>
</html>
