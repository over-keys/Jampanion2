name: Deploy Jampanion2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate source
        run: scripts/validate-static.sh

      - name: Build site
        run: scripts/build.sh

      - name: Report payload sizes
        shell: bash
        run: |
          set -euo pipefail
          echo '--- optimized payload sizes ---'
          du -sh dist dist/_framework
          python3 - <<'PY_SIZE'
          from pathlib import Path
          root = Path('dist/_framework')
          wasm = [p for p in root.glob('*.wasm') if not p.name.endswith(('.br', '.gz'))]
          br = list(root.glob('*.wasm.br'))
          print(f'raw framework .wasm total: {sum(p.stat().st_size for p in wasm):,} bytes')
          print(f'brotli framework .wasm total: {sum(p.stat().st_size for p in br):,} bytes')
          for p in sorted(wasm, key=lambda p: p.stat().st_size, reverse=True)[:12]:
              print(f'{p.stat().st_size:>10,}  {p.name}')
          PY_SIZE

      - name: Prepare GitHub Pages base path
        run: scripts/prepare-pages.sh dist "${GITHUB_REPOSITORY#*/}"

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/viewer/index.html
          test -s dist/viewer/assets/MuseJazzText.otf
          test -s dist/js/jazz-chart-host.js
          test -s dist/js/jampanion-audio.js
          test ! -e dist/js/jampanion-browser.js
          test -s dist/soundfonts/FluidR3_Jampanion.sf3
          test -s dist/app-version.json
          grep -q '"version": "47"' dist/app-version.json
          grep -q "<base href=\"/${GITHUB_REPOSITORY#*/}/\" />" dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
